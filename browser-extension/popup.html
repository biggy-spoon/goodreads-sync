<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Goodreads sync</title>
<style>
  body { font: 14px system-ui, sans-serif; width: 280px; padding: 12px; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; margin-top: 10px; font-size: 12px; color: #444; }
  input { width: 100%; box-sizing: border-box; padding: 6px; font-size: 14px; margin-top: 2px; }
  button { width: 100%; margin-top: 12px; padding: 8px; font-size: 14px; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; min-height: 2.5em; }
  #status.ok { color: #1a7f37; }
  #status.err { color: #cf222e; }
</style>
</head>
<body>
  <h1>Send cookie to e-reader</h1>
  <label for="address">Address shown on the e-reader (ip:port)</label>
  <input id="address" type="text" placeholder="192.168.1.42:8970" autocomplete="off">
  <label for="code">Code shown on the e-reader</label>
  <input id="code" type="text" inputmode="numeric" maxlength="4" placeholder="1234" autocomplete="off">
  <button id="send">Send</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
